# CamperBoss Camper-section audit for AppLab.
# Audit-only, no production data outside the emulator.
appId: com.camperboss.camperboss
---
- launchApp:
    clearState: true

- tapOn:
    point: "70%,93%"

- extendedWaitUntil:
    visible: "Camper"
    timeout: 20000
- takeScreenshot: "camperboss-camper-hub"

- tapOn: "Vehicle profile"
- extendedWaitUntil:
    visible: "My vehicle"
    timeout: 15000
- takeScreenshot: "camperboss-vehicle-profile-empty"

- tapOn: "Create profile"
- extendedWaitUntil:
    visible: "Create profile"
    timeout: 10000
- takeScreenshot: "camperboss-vehicle-profile-form"
- pressKey: BACK
- pressKey: BACK

- extendedWaitUntil:
    visible: "Camper"
    timeout: 15000
- tapOn: "Documents"
- extendedWaitUntil:
    visible: "Documents"
    timeout: 15000
- takeScreenshot: "camperboss-documents-empty"
- pressKey: BACK

- extendedWaitUntil:
    visible: "Camper"
    timeout: 15000
- tapOn: "Maintenance"
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 15000
- takeScreenshot: "camperboss-maintenance-empty"

- tapOn: "Add service"
- extendedWaitUntil:
    visible: "Add service"
    timeout: 10000
- takeScreenshot: "camperboss-maintenance-form"
