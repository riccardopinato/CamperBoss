# STEP 16Q top-level Android runtime smoke.
# Clean installs intentionally show the real-data Home cockpit and Guided Setup.
# Boss Readiness is not rendered until enough real local signals exist, so it
# must never be used as the first-run reachability sentinel.
appId: com.camperboss.camperboss
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "^(Camper cockpit|Cockpit camper|Camper-Cockpit|Cockpit du camping-car|Panel del camper|Painel do camper)$"
    timeout: 20000

- takeScreenshot: "camperboss-16q-home"

- tapOn:
    text: "^(Map|Mappa|Karte|Carte|Mapa)$"
- takeScreenshot: "camperboss-16q-map"

- tapOn:
    text: "^(Trips|Viaggi|Reisen|Voyages|Viajes|Viagens)$"
- takeScreenshot: "camperboss-16q-trips"

- tapOn:
    text: "^(Camper|Camping-car)$"
- takeScreenshot: "camperboss-16q-camper"

- tapOn:
    text: "^(More|Altro|Mehr|Plus|Más|Mais)$"
- takeScreenshot: "camperboss-16q-more"

- stopApp
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      text: "^(Camper cockpit|Cockpit camper|Camper-Cockpit|Cockpit du camping-car|Panel del camper|Painel do camper)$"
    timeout: 20000
- takeScreenshot: "camperboss-16q-relaunch"
