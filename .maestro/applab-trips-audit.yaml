# CamperBoss Trips audit for AppLab.
# Audit-only flow: no production code changes.
appId: com.camperboss.camperboss
---
- launchApp:
    clearState: true

- tapOn:
    point: "50%,93%"

- extendedWaitUntil:
    visible: "Trips"
    timeout: 20000
- takeScreenshot: "camperboss-trips-hub"

- tapOn: "Trip planner"
- extendedWaitUntil:
    visible: "Trip planner"
    timeout: 20000
- takeScreenshot: "camperboss-trip-planner-empty"

- tapOn: "Create trip"
- extendedWaitUntil:
    visible: "Add trip"
    timeout: 10000
- takeScreenshot: "camperboss-trip-editor-empty"
- pressKey: BACK
- pressKey: BACK

- extendedWaitUntil:
    visible: "Trips"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "GPX, memories & statistics"
    direction: DOWN
    timeout: 15000
- tapOn: "GPX, memories & statistics"

- extendedWaitUntil:
    visible: "Travel history"
    timeout: 20000
- takeScreenshot: "camperboss-travel-history-timeline"

- tapOn: "Map"
- takeScreenshot: "camperboss-travel-history-map-empty"

- tapOn: "Summary"
- takeScreenshot: "camperboss-travel-history-summary-empty"
