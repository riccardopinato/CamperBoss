name: Release Core Platform Builds

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/release-core-platforms.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Verify APK and audit size
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          ls -lh "$APK"
          SIZE=$(stat -c%s "$APK")
          WARN_BYTES=$((80 * 1024 * 1024))
          echo "ARM64 release APK: $SIZE bytes"
          if [ "$SIZE" -gt "$WARN_BYTES" ]; then
            echo "::warning::ARM64 release APK exceeds the 80 MiB optimization target."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: camperboss-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify privacy backup policy
        run: |
          grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/data_extraction_rules.xml

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS release
        run: flutter build ios --release --no-codesign

      - name: Audit iOS app size
        run: |
          test -d build/ios/iphoneos/Runner.app
          du -sh build/ios/iphoneos/Runner.app

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Web release
        run: flutter build web --release

      - name: Audit Web bundle size
        run: |
          test -s build/web/index.html
          du -sh build/web
          find build/web -type f -maxdepth 2 -print0 | xargs -0 du -h | sort -h | tail -20
