name: Release Core Platform Builds

on:
  push:
    branches:
      - "step-16*"
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "web/**"
      - "tool/**"
      - "release/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/release-core-platforms.yml"
  pull_request:
    branches:
      - main
      - "step-16*"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      android:
        description: "Build Android ARM64 QA release APK"
        required: true
        default: true
        type: boolean
      web:
        description: "Build Web release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  android:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.android }}
    name: Android QA release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Build QA release APK
        env:
          ORG_GRADLE_PROJECT_requireReleaseSigning: "false"
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify QA APK and write hash evidence
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          mkdir -p build/evidence
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          printf '{"sourceSha":"%s","artifact":"%s","sha256":"%s","bytes":%s,"signingClass":"QA_ONLY"}\n' \
            "${{ github.sha }}" "$APK" "$SHA" "$SIZE" > build/evidence/android-qa-release.json
      - name: Upload QA APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camperboss-qa-arm64-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/evidence/android-qa-release.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Verify privacy backup policy
        run: |
          grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/data_extraction_rules.xml

  web:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.web }}
    name: Web release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Build Web release
        run: flutter build web --release
      - name: Audit Web bundle size
        run: |
          test -s build/web/index.html
          du -sh build/web
          find build/web -maxdepth 2 -type f -print0 | xargs -0 du -h | sort -h | tail -20
      - name: Upload Web candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camperboss-web-release-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 30
