name: Android Internal Delivery

on:
  workflow_dispatch:
    inputs:
      release_status:
        description: "Google Play release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - completed
      upload_metadata:
        description: "Upload reviewed fastlane metadata"
        required: true
        default: false
        type: boolean
      upload_images:
        description: "Upload reviewed listing images"
        required: true
        default: false
        type: boolean
      upload_screenshots:
        description: "Upload reviewed screenshots"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-internal-delivery
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME || 'com.camperboss.camperboss' }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
      FASTLANE_UPLOAD_METADATA: ${{ inputs.upload_metadata }}
      FASTLANE_UPLOAD_IMAGES: ${{ inputs.upload_images }}
      FASTLANE_UPLOAD_SCREENSHOTS: ${{ inputs.upload_screenshots }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate delivery secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Materialize Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build signed AAB once
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          sha256sum "$AAB"
          ls -lh "$AAB"

      - name: Upload immutable AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: camperboss-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the same AAB to Play Internal Testing
        run: bundle exec fastlane android internal aab_path:"build/app/outputs/bundle/release/app-release.aab"
