name: Step 16C Certification Once

on:
  push:
    branches:
      - step-16-release-core
    paths:
      - ".github/workflows/step16c-certify-once.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --timeout=60s

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Build Web release
        run: flutter build web --release

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/web/index.html
          ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          du -sh build/web

      - name: Upload Step 16C APK
        uses: actions/upload-artifact@v4
        with:
          name: camperboss-step16c-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
