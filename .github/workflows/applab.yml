name: AppLab Production Gate
# Preserve the existing named PR gate; source-only by default.
# FULL trusted APK/runtime requires explicit workflow_dispatch.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  applab:
    name: Source identity and trust contracts (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify source and release identity
        run: python3 tool/ci/release_guard.py identity
      - name: Verify source trust boundaries
        run: python3 tool/ci/release_guard.py trust-boundaries

  applab-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: riccardopinato/AppLab/.github/workflows/external-project-runner.yml@931c124dbb1a36d43842db5b60bd5f04843e5330
    with:
      repository: riccardopinato/CamperBoss
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_ref: ${{ github.head_ref || github.ref_name }}
      working_directory: "."
      flutter_version: "3.47.6"
      java_version: "21"
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      package_id: com.camperboss.camperboss
      build_command: flutter build apk --release --target-platform android-arm64 --split-per-abi
      run_maestro: true
      maestro_flow: .maestro/applab-release-core-final.yaml
      history_key: camperboss
      cache_verification: false
      config_fingerprint: camperboss-golden-applab-v1
      analysis_mode: full
      publish_release_artifact: false
