name: camperboss
description: Premium Flutter app for camper, vanlife, and motorhome travel planning.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  easy_localization: ^3.0.8
  file_picker: ^12.0.0-beta.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: 8.2.2
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  google_mlkit_document_scanner: ^0.4.1
  google_mlkit_text_recognition: ^0.15.1
  http: ^1.6.0
  latlong2: ^0.9.1
  open_route_service: 1.2.7
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  sqflite: ^2.4.3
  timezone: ^0.11.0
  url_launcher: ^6.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
